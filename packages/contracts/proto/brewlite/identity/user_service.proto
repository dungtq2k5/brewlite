syntax = "proto3";

package brewlite.identity;

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  // Sets the caller's password; every session but `session_id` (the caller's own) is deleted.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message Me {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  bool has_password = 5;
  string preferred_locale = 6;
  string created_at = 7;
  // I-1 `firebase_uid IS NOT NULL` — linked to a Firebase (Google) sign-in.
  bool signs_in_with_google = 8;
}

message GetMeRequest {}
message GetMeResponse { Me me = 1; }

message UpdateMeRequest {
  optional string full_name = 1;
  optional string preferred_locale = 2;
}
message UpdateMeResponse { Me me = 1; }

message ChangePasswordRequest {
  string session_id = 1; // the access token's `sid` — the one session kept
  optional string current_password = 2; // required when the account has a password
  string new_password = 3;
}
message ChangePasswordResponse {}
