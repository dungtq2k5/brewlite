packages:
  - apps/*
  - services/*
  - packages/*

strictDepBuilds: true

# Populated after the first install names what it wants to run; each entry is
# allowed because its build script is required for the package to work.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - prisma
  - '@prisma/engines'
  - simple-git-hooks
  - '@bufbuild/buf'
  - protobufjs
  - '@scarf/scarf'
  - '@firebase/util'
  - msgpackr-extract
  - unrs-resolver

# `ignoredBuiltDependencies` only silences the "would you like to allow this?" warning —
# strictDepBuilds still fails the install unless the package is also listed above, so
# @scarf/scarf (a telemetry-ping postinstall, harmless either way) is just allowed too.

# @nestjs/platform-express 11.2.6–11.2.8 pins multer 2.4.0 exactly (GHSA-q7qp-rjg7-q26m, DoS via a
# pending async fileFilter). 11.2.9 moved to 2.5.0 itself; this forces that same version until the
# Nest packages are bumped — then drop it.
overrides:
  multer: ^2.5.0
  # The repo is written for TypeScript 5.9 (root `typescript`). Prisma 7.10 and orval 8.45 accept
  # any TypeScript as an optional peer, and pnpm then resolved some packages' `tsc` to 6.0, which
  # rejects `baseUrl`. Moving to TypeScript 6 is its own change; until then, one version.
  typescript: ^5.9.0

# `pnpm audit` advisories accepted on purpose, each with its reason. Nothing else is ignored: a new
# high advisory in a runtime dependency fails CI (`pnpm audit --prod --audit-level high`) until it
# is fixed or listed here.
auditConfig:
  ignoreGhsas:
    # @grpc/grpc-js via firebase → @firebase/firestore: Firestore is never imported (Auth only), so
    # the code is never bundled. Re-check when @firebase/firestore moves off ~1.9.0.
    - GHSA-m9gg-hp2v-232j
    # picomatch via @typescript-eslint (lint time, our own patterns): no fixed version exists yet.
    - GHSA-fc5q-39xc-vjpf
