# SonarCloud, analysed in CI (pr.yml's last step) so it can import the coverage reports —
# Automatic Analysis cannot. Replaces .sonarcloud.properties.
sonar.organization=dungtq2k5
sonar.projectKey=dungtq2k5_brewlite

# Sources and tests share directories (specs sit next to the code), so the test patterns are both
# test inclusions and source exclusions — a file is never indexed twice.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/test/**,apps/web/e2e/**

# Generated code is not reviewed by people, so it is not analysed: Orval's client, ts-proto's gRPC
# code, Prisma's migrations (where an Oracle PL/SQL rule misfires on PostgreSQL) and the emitted
# OpenAPI document. Each is regenerated and diffed in CI. Build output and reports are not source.
sonar.exclusions=**/generated/**,**/prisma/migrations/**,services/gateway/openapi.json,**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/test/**,apps/web/e2e/**

# Every package's report (paths relative to this directory). The shared packages' files appear in
# several reports; SonarCloud unions them, as scripts/coverage-check.mjs does.
sonar.javascript.lcov.reportPaths=packages/contracts/coverage/lcov.info,packages/api-client/coverage/lcov.info,packages/nest-common/coverage/lcov.info,services/identity/coverage/lcov.info,services/catalog/coverage/lcov.info,services/ordering/coverage/lcov.info,services/payment/coverage/lcov.info,services/gateway/coverage/lcov.info,apps/web/coverage/lcov.info

# Exactly packages/config/coverage.mjs's COVERAGE_EXCLUDE (a spec keeps the two equal).
sonar.coverage.exclusions=**/generated/**,**/prisma/migrations/**,**/openapi.json,**/src/main.ts,**/instrumentation.ts,**/*.d.ts,**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/test/**,**/e2e/**,**/scripts/**
