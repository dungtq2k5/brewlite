name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy .env.example to .env for every service
        run: for s in services/* apps/*; do cp "$s/.env.example" "$s/.env"; done

      - run: pnpm keys:dev

      - name: Regenerate the gRPC client and fail on drift
        run: pnpm proto:generate && git diff --exit-code

      - run: pnpm proto:lint

      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:md

      - run: pnpm build

      - run: pnpm test

      - name: Guard specs
        run: pnpm --filter @brewlite/config exec vitest run --project guards

      - name: Regenerate the OpenAPI document and fail on drift
        run: pnpm --filter @brewlite/gateway openapi:emit && git diff --exit-code

      - name: Regenerate the API client and fail on drift
        run: pnpm --filter @brewlite/api-client generate && git diff --exit-code

      - name: Regenerate the web theme and fail on drift
        run: pnpm --filter @brewlite/web theme && git diff --exit-code

      - name: Start the infra stack
        run: docker compose up -d --wait

      - run: pnpm db:setup
      - run: pnpm db:drift

      - run: pnpm test:integration

      - name: Build and boot the service images
        run: docker compose --profile apps up -d --build --wait

      - name: Make a throwaway password for the seeded accounts
        run: echo "SEED_ACCOUNT_PASSWORD=$(openssl rand -hex 12)Aa1!" >> "$GITHUB_ENV"

      - name: Seed the dev accounts and menu
        run: |
          pnpm --filter @brewlite/identity seed:dev
          pnpm --filter @brewlite/catalog seed:dev

      - run: pnpm --filter @brewlite/web exec playwright install --with-deps chromium

      - name: Web e2e, through Caddy as a browser would
        run: pnpm --filter @brewlite/web e2e
        env:
          E2E_BASE_URL: http://localhost:23000

      - name: Keep the Playwright report when the specs fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
