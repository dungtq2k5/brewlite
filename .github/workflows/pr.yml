name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy .env.example to .env for every service
        run: for s in services/*; do cp "$s/.env.example" "$s/.env"; done

      - name: Regenerate the gRPC client and fail on drift
        run: pnpm proto:generate && git diff --exit-code

      - run: pnpm proto:lint

      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:md

      - run: pnpm build

      - run: pnpm test

      - name: Regenerate the OpenAPI document and fail on drift
        run: pnpm --filter @brewlite/gateway openapi:emit && git diff --exit-code

      - name: Start the infra stack
        run: docker compose up -d --wait

      - run: pnpm db:setup
      - run: pnpm db:drift

      - run: pnpm test:integration

      - name: Build and boot the service images
        run: docker compose --profile apps up -d --build --wait
