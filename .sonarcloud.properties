# Generated code is not reviewed by people, so it is not analysed: Orval's client,
# ts-proto's gRPC code, Prisma's migrations (where an Oracle PL/SQL rule misfires on
# PostgreSQL) and the emitted OpenAPI document. Each is regenerated and diffed in CI.
sonar.exclusions=**/generated/**,**/prisma/migrations/**,services/gateway/openapi.json
